<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Semi+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Tank Turn Tactics</title>
    <script>
      // Restore a deep link that arrived via the 404.html SPA fallback
      // (?p=/game/abc&q=…). Runs before React mounts; BrowserRouter then
      // picks the route up normally.
      (function () {
        var s = new URLSearchParams(window.location.search);
        var p = s.get('p');
        if (!p) return;
        var base = window.location.pathname.replace(/\/$/, '');
        var url = base + p;
        var q = s.get('q');
        if (q) url += '?' + q;
        window.history.replaceState(null, '', url);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
