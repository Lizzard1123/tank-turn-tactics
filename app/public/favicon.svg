<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- field-manual khaki tile -->
  <rect width="64" height="64" rx="12" fill="#e9e2cf"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="10.5" fill="none" stroke="#26251d" stroke-width="3"/>
  <!-- barrel + signal muzzle brake -->
  <rect x="34" y="18" width="20" height="6" rx="2" fill="#26251d"/>
  <rect x="48" y="16" width="8" height="10" rx="2.5" fill="#c8471f"/>
