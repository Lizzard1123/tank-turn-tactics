  <rect x="18" y="12" width="20" height="16" rx="4" fill="#26251d"/>
  <!-- hull -->
  <rect x="8" y="25" width="48" height="11" fill="#26251d"/>
  <!-- treads -->
  <rect x="6" y="34" width="52" height="16" rx="8" fill="#26251d"/>
  <!-- road wheels -->
  <circle cx="16" cy="42" r="4" fill="#e9e2cf"/>
  <circle cx="28" cy="42" r="4" fill="#e9e2cf"/>
  <circle cx="40" cy="42" r="4" fill="#e9e2cf"/>
  <circle cx="52" cy="42" r="4" fill="#e9e2cf"/>
</svg>
