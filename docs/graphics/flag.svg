  <rect x="70" y="52" width="52" height="36" fill="#c8471f" stroke="#26251d" stroke-width="2" />
  <text x="80" y="150" text-anchor="middle" fill="#26251d" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700">Flag marker</text>
</svg>
